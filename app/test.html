<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mobilité Littorale & SAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=DM+Serif+Display&display=swap"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f1;--surface:#ffffff;--border:#e6e3de;--border-dark:#ccc9c2;
  --text:#1a1916;--muted:#78746e;--faint:#b0aca5;
  --accent:#1a1916;--accent-light:#efede9;
  --green:#2d6a4f;--green-bg:#eef7f2;
  --orange:#a0500f;--orange-bg:#fdf3ec;
  --sans:'DM Sans',sans-serif;--mono:'DM Mono',monospace;--serif:'DM Serif Display',serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}
.hidden{display:none!important}
input,select,button{font-family:var(--sans)}
/* ── Input ── */
.inp{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;color:var(--text);background:var(--surface);outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--border-dark)}
.lbl{display:block;font-size:11px;font-weight:500;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
.field{margin-bottom:14px}
/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--sans);font-weight:500;font-size:13px;cursor:pointer;border-radius:6px;padding:8px 16px;border:none;transition:opacity .12s,filter .12s}
.btn:hover{filter:brightness(.93)}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-danger{background:transparent;color:#8b1a1a;border:1px solid #f0c5c5}
.btn-green{background:var(--green);color:#fff}
.btn-icon{background:transparent;border:none;color:var(--faint);cursor:pointer;display:flex;padding:4px}
.btn-full{width:100%;justify-content:center}
/* ── Toast ── */
#toast{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.13);transition:opacity .3s;opacity:0;pointer-events:none;color:#fff}
#toast.show{opacity:1}
#toast.ok{background:var(--green)}
#toast.err{background:#8b1a1a}
/* ── Nav ── */
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;gap:2px;position:sticky;top:0;z-index:100}
.nav-logo{margin-right:auto;display:flex;align-items:center;gap:10px;padding:14px 0}
.nav-logo-icon{width:26px;height:26px;border-radius:5px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.nav-logo-text{font-family:var(--serif);font-size:16px;letter-spacing:.01em}
.nav-btn{background:transparent;color:var(--muted);border:none;border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:var(--sans);font-weight:400;display:flex;align-items:center;gap:6px;transition:background .12s,color .12s}
.nav-btn.active{background:var(--accent-light);color:var(--text);font-weight:500}
.nav-user{margin-left:12px;padding-left:12px;border-left:1px solid var(--border);display:flex;align-items:center;gap:8px}
.nav-user-name{font-size:12px;color:var(--faint)}
/* ── Pages ── */
.page{max-width:900px;margin:0 auto;padding:36px 24px}
.page-sm{max-width:640px;margin:0 auto;padding:36px 24px}
.page-xs{max-width:500px;margin:0 auto;padding:32px 24px}
/* ── SubHeader ── */
.subheader{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:12px}
.subheader h2{margin:0;font-size:15px;font-weight:500;flex:1}
/* ── Stat cards ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:32px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px}
.stat-card-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.stat-card-value{font-family:var(--mono);font-size:22px;font-weight:500}
.stat-card-sub{font-size:12px;color:var(--faint);margin-top:4px}
/* ── Ticket list ── */
.ticket-list{display:grid;gap:6px}
.ticket-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:border-color .12s}
.ticket-item:hover{border-color:var(--border-dark)}
.ticket-item-info{flex:1;min-width:0}
.ticket-item-title{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket-item-sub{font-size:12px;color:var(--muted);margin-top:2px}
.ticket-item-amount{text-align:right;flex-shrink:0}
.ticket-item-total{font-family:var(--mono);font-weight:500;font-size:15px}
.ticket-item-status{font-size:11px;margin-top:3px}
/* ── Members ── */
.member-list{display:grid;gap:8px}
.member-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 20px;display:flex;align-items:center;gap:14px}
.member-avatar{width:36px;height:36px;border-radius:8px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0}
.member-info{flex:1;min-width:0}
.member-name{font-weight:500;font-size:14px}
.member-email{font-size:12px;color:var(--muted);margin-top:1px}
.member-balance{text-align:right;flex-shrink:0}
.member-due{font-family:var(--mono);font-size:13px;font-weight:500}
.member-tickets{font-size:11px;color:var(--faint);margin-top:2px}
/* ── Detail ── */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.dt-label{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.dt-value{font-size:14px;color:var(--text)}
.dt-value.mono{font-family:var(--mono)}
/* ── Calc lines ── */
.calc-line{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calc-label{font-size:13px;color:var(--muted)}
.calc-label.bold{font-size:14px;color:var(--text);font-weight:600}
.calc-value{font-family:var(--mono);font-size:13px;color:var(--muted);font-weight:500}
.calc-value.bold{font-size:17px;color:var(--text);font-weight:700}
/* ── Filters ── */
.filters{display:flex;gap:6px;margin-bottom:18px}
.filter-btn{font-family:var(--sans);font-size:12px;font-weight:500;background:var(--surface);color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:5px 14px;cursor:pointer;transition:all .15s}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* ── Toggle ── */
.toggle-wrap{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.toggle{width:38px;height:21px;border-radius:11px;background:var(--border);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none}
.toggle.on{background:var(--accent)}
.toggle-knob{width:15px;height:15px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.18);pointer-events:none}
.toggle.on .toggle-knob{left:20px}
/* ── Divider ── */
.divider{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.divider-label{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.divider-line{flex:1;height:1px;background:var(--border)}
/* ── Badge ── */
.badge{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:4px 12px;border-radius:20px}
.badge-pending{background:var(--orange-bg);color:var(--orange);border:1px solid #f5c9a0}
.badge-paid{background:var(--green-bg);color:var(--green);border:1px solid #b7dfc8}
/* ── Address input ── */
.addr-wrap{position:relative}
.addr-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.addr-wrap .inp{padding-left:36px}
/* ── Map ── */
#map-container{border-radius:10px;overflow:hidden;border:1px solid var(--border);position:relative;margin-bottom:0}
#map{width:100%;height:220px}
.map-overlay{position:absolute;inset:0;background:rgba(245,244,241,.85);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--muted)}
.route-info{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;padding:10px 16px;margin-bottom:18px}
.route-stat span{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;display:block}
.route-stat strong{font-family:var(--mono);font-size:18px;font-weight:500}
.route-sep{width:1px;height:32px;background:var(--border)}
/* ── Tariff box ── */
.tariff-box{border:1px solid var(--border);border-radius:10px;padding:20px;background:var(--surface);margin-top:36px}
.tariff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-top:14px}
.tariff-item-label{font-size:11px;color:var(--faint);margin-bottom:3px}
.tariff-item-value{font-family:var(--mono);font-size:14px;color:var(--text)}
/* ── Preview card ── */
.preview-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:18px}
/* ── Login ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{width:100%;max-width:360px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:26px}
.login-header{text-align:center;margin-bottom:32px}
.login-icon{width:48px;height:48px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.login-title{font-family:var(--serif);font-size:24px;font-weight:400}
.login-sub{font-size:11px;color:var(--faint);margin:5px 0 0;letter-spacing:.1em;text-transform:uppercase}
.err-box{background:#fdf2f2;border:1px solid #f0c5c5;border-radius:6px;padding:9px 12px;margin-bottom:14px;font-size:13px;color:#8b1a1a}
/* ── Info ── */
.box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:12px}
/* ── Print ── */
@media print{
  body *{visibility:hidden!important}
  #print-zone,#print-zone *{visibility:visible!important}
  #print-zone{position:fixed;inset:0;background:#fff;padding:40px 56px;font-family:var(--sans);color:var(--text)}
  .no-print{display:none!important}
}
/* ── Empty ── */
.empty{text-align:center;padding:48px 20px;font-size:13px;color:var(--faint)}
/* ── Loader ── */
#loader{min-height:100vh;display:flex;align-items:center;justify-content:center}
.pac-container{z-index:99999!important;font-family:var(--sans)!important;border-radius:8px!important;box-shadow:0 4px 24px rgba(0,0,0,.12)!important;border:1px solid var(--border)!important;margin-top:4px!important}
.pac-item{padding:8px 14px!important;font-size:13px!important;cursor:pointer!important}
.pac-item:hover{background:#f5f4f1!important}
.pac-item-query{font-weight:500!important;color:var(--text)!important}
</style>
</head>
<body>

<!-- Toast -->
<div id="toast"></div>

<!-- App root -->
<div id="app">
  <div id="loader"><span style="font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:3px">chargement…</span></div>
</div>

<!-- SVG Icons sprite -->
<svg style="display:none">
  <symbol id="ic-car" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 11L6.5 6.5h11L19 11M5 11H3v3h1v1.5a.5.5 0 001 0V14h12v.5a.5.5 0 001 0V14h1v-3h-2M5 11h14M7 14.5a1 1 0 110-2 1 1 0 010 2zm10 0a1 1 0 110-2 1 1 0 010 2z"/>

  </symbol>
  <symbol id="ic-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>
  </symbol>
  <symbol id="ic-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

<script>
/* ─── Constants ─────────────────────────────────────────── */
const RATE_KM   = 0.55;
const SURCHARGE = 0.20;
const ADMIN_PWD = "admin2024";
const STORAGE_KEY = "mls-v3-data";
const GMAPS_KEY   = "AIzaSyDuuhocrv_oktg2Jq-IKp_dE1X_tHQOH3Q";

/* ─── Helpers ───────────────────────────────────────────── */
const fmt      = n => n.toFixed(2).replace(".",",") + " €";
const fmtDate  = iso => new Date(iso).toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"});
const fmtShort = iso => new Date(iso).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"});
const esc      = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const ic       = (n,s=16,c="currentColor") =>
  `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#ic-${n}"/></svg>`;
const calcTicket = (km,toll) => {
  const base = parseFloat((km*RATE_KM).toFixed(2));
  const fuel = parseFloat((km*SURCHARGE).toFixed(2));
  const t    = parseFloat(toll)||0;
  return {base,fuel,toll:t,total:parseFloat((base+fuel+t).toFixed(2))};
};
let toastTimer = null;
function showToast(msg,type="ok"){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className   = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.className=""; },3200);
}

/* ─── Storage ───────────────────────────────────────────── */
const defaultData = () => ({
  members:[{id:"admin",name:"Administrateur",email:"admin@mls.fr",phone:"",role:"admin",password:ADMIN_PWD,createdAt:new Date().toISOString()}],
  tickets:[]
});
async function loadData() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : defaultData();
  } catch (e) {
    return defaultData();
  }
}

async function saveData(d) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
  } catch (e) {}
}
/* ─── Google Maps ───────────────────────────────────────── */
let gmapsReady=false, gmapsCbs=[];
function loadGMaps(){
  return new Promise(resolve=>{
    if(gmapsReady&&window.google?.maps){resolve();return;}
    gmapsCbs.push(resolve);
    if(document.querySelector("script[data-gmaps]"))return;
    window.__gmapsReady=()=>{gmapsReady=true;gmapsCbs.forEach(c=>c());gmapsCbs=[];};
    const s=document.createElement("script");
    s.setAttribute("data-gmaps","1");
    s.src=`https://maps.googleapis.com/maps/api/js?key=${GMAPS_KEY}&libraries=places&callback=__gmapsReady`;
    s.async=true;s.defer=true;
    document.head.appendChild(s);
  });
}

/* ═══════════════════════════════════════════════════════════
   APP STATE
═══════════════════════════════════════════════════════════ */
let DB    = null;
let USER  = null;
let VIEW  = "login";
let SEL   = null;  // selected ticket

// Map/route state for new-ticket form
let mapInstance    = null;
let dirRenderer    = null;
let routeCalcTimer = null;
let autocompleteA  = null;
let autocompleteB  = null;

/* ─── Router ──────────────────────────────────────────────── */
function go(view, sel=null){
  SEL  = sel;
  VIEW = view;
  render();
}

/* ─── Render ─────────────────────────────────────────────── */
function render(){
  const app = document.getElementById("app");
  const isAdmin = USER?.role==="admin";
  switch(VIEW){
    case "login":        app.innerHTML = renderLogin();      bindLogin();        break;
    case "dashboard":    app.innerHTML = renderDashboard();  bindDashboard();    break;
    case "tickets":      app.innerHTML = renderTickets();    bindTickets();      break;
    case "newTicket":    app.innerHTML = renderNewTicket();  bindNewTicket();    break;
    case "members":      app.innerHTML = renderMembers();    bindMembers();      break;
    case "newMember":    app.innerHTML = renderNewMember();  bindNewMember();    break;
    case "ticketDetail": app.innerHTML = renderTicketDetail(); bindTicketDetail(); break;
    default:             app.innerHTML = renderLogin();      bindLogin();
  }
}

/* ─── Nav HTML ───────────────────────────────────────────── */
function navHtml(active){
  const isAdmin = USER?.role==="admin";
  const items = [
    {id:"dashboard",label:"Tableau de bord",icon:"grid"},
    {id:"tickets",label:"Tickets",icon:"ticket"},
    ...(isAdmin?[{id:"members",label:"Membres",icon:"user"}]:[]),
  ];
  const btns = items.map(it=>`
    <button class="nav-btn${active===it.id?" active":""}" data-nav="${it.id}">
      ${ic(it.icon,14)} ${esc(it.label)}
    </button>`).join("");
  return `
  <nav>
    <div class="nav-logo">
      <div class="nav-logo-icon">${ic("car",13,"#fff")}</div>
      <span class="nav-logo-text">MLS</span>
    </div>
    ${btns}
    <div class="nav-user">
      <span class="nav-user-name">${esc(USER.name.split(" ")[0])}</span>
      <button class="btn-icon" id="btn-logout">${ic("logout",15)}</button>
    </div>
  </nav>`;
}

function bindNav(){
  document.querySelectorAll("[data-nav]").forEach(b=>{
    b.addEventListener("click",()=>go(b.dataset.nav));
  });
  const bl = document.getElementById("btn-logout");
  if(bl) bl.addEventListener("click",()=>{ USER=null; go("login"); });
}

/* ─── SubHeader ──────────────────────────────────────────── */
function subHeaderHtml(title, extra=""){
  return `
  <div class="subheader">
    <button class="btn-icon" id="btn-back">${ic("back",20)}</button>
    <h2>${esc(title)}</h2>
    ${extra}
  </div>`;
}

/* ═══════════════════════════════ LOGIN ═══════════════════ */

function bindNewTicket(){
  document.getElementById("btn-back").addEventListener("click",()=>go("tickets"));

  // Sync state from inputs
  const sync=()=>{
    const isAdmin=USER.role==="admin";
    if(isAdmin) NT.memberId=document.getElementById("nt-member")?.value||"";
    NT.date   = document.getElementById("nt-date").value;
    NT.km     = document.getElementById("nt-km").value;
    NT.toll   = document.getElementById("nt-toll")?.value||"";
    NT.notes  = document.getElementById("nt-notes").value;
  };

  // Toggle toll
  document.getElementById("toggle-toll").addEventListener("click",()=>{
    sync();
    NT.hasToll=!NT.hasToll;
    renderNewTicket_update();
  });

  // Live preview on km/toll change
  const kmInp=document.getElementById("nt-km");
  kmInp.addEventListener("input",()=>{ sync(); renderNewTicket_update(); });

  // Toll input
  const tollInp=document.getElementById("nt-toll");
  if(tollInp) tollInp.addEventListener("input",()=>{ sync(); renderNewTicket_update(); });

  // Notes
  document.getElementById("nt-notes").addEventListener("input",()=>{ NT.notes=document.getElementById("nt-notes").value; });

  // Submit
  document.getElementById("btn-submit-ticket").addEventListener("click",async()=>{
    sync();
    const isAdmin=USER.role==="admin";
    if(isAdmin&&!NT.memberId){ showToast("Sélectionnez un membre.","err"); return; }
    const km=parseFloat(NT.km)||0;
    if(km<=0){ showToast("Distance invalide — vérifiez les adresses.","err"); return; }
    if(!NT.departure||!NT.destination){ showToast("Départ et destination requis.","err"); return; }
    const toll=NT.hasToll?(parseFloat(NT.toll)||0):0;
    const t={
      id:Date.now().toString(), memberId:NT.memberId, date:NT.date,
      departure:NT.departure, destination:NT.destination,
      km, hasToll:NT.hasToll, toll, notes:NT.notes,
      ...calcTicket(km,toll), paid:false, createdAt:new Date().toISOString()
    };
    DB={...DB,tickets:[...DB.tickets,t]};
    await saveData(DB);
    showToast("Ticket créé !");
    NT=ntDefault();
    go("tickets");
  });

  // Init Google Maps autocomplete
  loadGMaps().then(()=>initAutocomplete());
}

function renderNewTicket_update(){
  // Re-render just the relevant sections without losing map
  const km=parseFloat(NT.km)||0;
  const toll=NT.hasToll?(parseFloat(NT.toll)||0):0;
  const calc=km>0?calcTicket(km,toll):null;

  // Update preview
  let preview=document.getElementById("preview-section");
  if(!preview){
    preview=document.createElement("div");
    preview.id="preview-section";
    document.getElementById("btn-submit-ticket").before(preview);
  }
  if(calc){
    preview.innerHTML=`
    <div class="preview-card">
      <p class="lbl" style="margin-bottom:12px">Aperçu du montant</p>
      <div class="calc-line"><span class="calc-label">${km} km × ${fmt(RATE_KM)} (tarif km)</span><span class="calc-value">${fmt(calc.base)}</span></div>
      <div class="calc-line"><span class="calc-label">${km} km × ${fmt(SURCHARGE)} (carburant)</span><span class="calc-value">${fmt(calc.fuel)}</span></div>
      ${NT.hasToll&&toll>0?`<div class="calc-line"><span class="calc-label">Péage à rembourser</span><span class="calc-value" style="color:var(--orange)">${fmt(toll)}</span></div>`:""}
      <div style="border-top:1px solid var(--border);margin-top:10px;padding-top:10px">
        <div class="calc-line"><span class="calc-label bold">Total dû</span><span class="calc-value bold">${fmt(calc.total)}</span></div>
      </div>
    </div>`;
  } else { preview.innerHTML=""; }

  // Toggle toll field visibility
  const tollField=document.getElementById("toll-field");
  if(tollField) tollField.style.display=NT.hasToll?"":"none";
  const toggle=document.getElementById("toggle-toll");
  if(toggle){ toggle.className="toggle"+(NT.hasToll?" on":""); }
}

function initAutocomplete(){
  const depInp  = document.getElementById("nt-dep");
  const destInp = document.getElementById("nt-dest");
  if(!depInp||!destInp) return;

  const opts={ componentRestrictions:{country:"fr"}, fields:["formatted_address","geometry","name"] };

  autocompleteA = new window.google.maps.places.Autocomplete(depInp, opts);
  autocompleteA.addListener("place_changed",()=>{
    const p=autocompleteA.getPlace();
    if(p.formatted_address){ NT.departure=p.formatted_address; checkShowMap(); }
  });
  depInp.addEventListener("input",()=>{ NT.departure=depInp.value; checkShowMap(); });

  autocompleteB = new window.google.maps.places.Autocomplete(destInp, opts);
  autocompleteB.addListener("place_changed",()=>{
    const p=autocompleteB.getPlace();
    if(p.formatted_address){ NT.destination=p.formatted_address; checkShowMap(); }
  });
  destInp.addEventListener("input",()=>{ NT.destination=destInp.value; checkShowMap(); });

  // If addresses already populated (back navigation), show map
  if(NT.departure.length>5&&NT.destination.length>5) calculateRoute();
}

function checkShowMap(){
  const sec=document.getElementById("map-section");
  if(!sec) return;
  if(NT.departure.length>5&&NT.destination.length>5){
    sec.style.display="";
    clearTimeout(routeCalcTimer);
    routeCalcTimer=setTimeout(calculateRoute,700);
  } else { sec.style.display="none"; }
}

function calculateRoute(){
  if(!NT.departure||!NT.destination) return;
  const overlay=document.getElementById("map-overlay");
  const routeInfo=document.getElementById("route-info");
  if(overlay) overlay.classList.remove("hidden");
  if(routeInfo) routeInfo.classList.add("hidden");

  if(!mapInstance){
    const mapEl=document.getElementById("map");
    if(!mapEl) return;
    mapInstance=new window.google.maps.Map(mapEl,{
      zoom:10, center:{lat:50.95,lng:2.33}, disableDefaultUI:true, zoomControl:true,
      styles:[
        {featureType:"all",elementType:"geometry",stylers:[{saturation:-30}]},
        {featureType:"road",elementType:"geometry",stylers:[{color:"#ffffff"}]},
        {featureType:"road",elementType:"geometry.stroke",stylers:[{color:"#e6e3de"}]},
        {featureType:"water",elementType:"geometry",stylers:[{color:"#d4e6f1"}]},
        {featureType:"poi",stylers:[{visibility:"off"}]},
        {featureType:"transit",stylers:[{visibility:"off"}]},
        {elementType:"labels.text.fill",stylers:[{color:"#78746e"}]},
      ]
    });
  }

  const ds=new window.google.maps.DirectionsService();
  if(dirRenderer) dirRenderer.setMap(null);
  dirRenderer=new window.google.maps.DirectionsRenderer({
    map:mapInstance, suppressMarkers:false,
    polylineOptions:{strokeColor:"#1a1916",strokeWeight:3,strokeOpacity:.8}
  });

  ds.route({ origin:NT.departure, destination:NT.destination, travelMode:window.google.maps.TravelMode.DRIVING },
    (result,status)=>{
      if(overlay) overlay.classList.add("hidden");
      if(status==="OK"){
        dirRenderer.setDirections(result);
        const leg=result.routes[0].legs[0];
        const distKm=parseFloat((leg.distance.value/1000).toFixed(1));
        // Update KM field
        NT.km=String(distKm);
        const kmInp=document.getElementById("nt-km");
        if(kmInp) kmInp.value=distKm;
        // Update route info strip
        const ri=document.getElementById("route-info");
        if(ri){
          ri.classList.remove("hidden");
          document.getElementById("route-dist").textContent=leg.distance.text;
          document.getElementById("route-dur").textContent=leg.duration.text;
        }
        // Setup recalc button
        const rb=document.getElementById("btn-recalc");
        if(rb){ rb.onclick=calculateRoute; }
        renderNewTicket_update();
      } else {
        if(overlay){ overlay.classList.remove("hidden"); overlay.innerHTML='<span style="color:#8b1a1a;font-size:13px">Impossible de calculer l\'itinéraire.</span>'; }
      }
    }
  );
}

      <div class="calc-line"><span class="calc-label">${t.km} km × ${fmt(RATE_KM)} (tarif kilométrique)</span><span class="calc-value">${fmt(t.base)}</span></div>
      <div class="calc-line"><span class="calc-label">${t.km} km × ${fmt(SURCHARGE)} (supplément carburant)</span><span class="calc-value">${fmt(t.fuel)}</span></div>
      ${t.hasToll&&t.toll>0?`<div class="calc-line"><span class="calc-label">Péage avancé — à rembourser</span><span class="calc-value" style="color:var(--orange)">${fmt(t.toll)}</span></div>`:""}
      <div style="border-top:1px solid var(--border);margin-top:12px;padding-top:12px">
        <div class="calc-line"><span class="calc-label bold">Montant total dû</span><span class="calc-value bold">${fmt(t.total)}</span></div>
      </div>
      ${t.paid&&t.paidAt?`<p style="margin:10px 0 0;font-size:12px;color:var(--green)">✓ Réglé le ${fmtDate(t.paidAt)}</p>`:""}
    </div>
    <!-- Admin actions -->
    ${isAdmin?`<div class="no-print" style="display:flex;gap:10px;flex-wrap:wrap">
      ${!t.paid?`<button class="btn btn-green" id="btn-mark-paid">${ic("check",15)} Marquer réglé</button>`:""}
      <button class="btn btn-danger" id="btn-delete-ticket">${ic("trash",15)} Supprimer</button>
    </div>`:""}
  </div>`;
}
function bindTicketDetail(){
  document.getElementById("btn-back").addEventListener("click",()=>go("tickets"));
  const bp=document.getElementById("btn-print");
  if(bp) bp.addEventListener("click",()=>window.print());
  const bm=document.getElementById("btn-mark-paid");
  if(bm) bm.addEventListener("click",async()=>{
    DB.tickets=DB.tickets.map(t=>t.id===SEL.id?{...t,paid:true,paidAt:new Date().toISOString()}:t);
    await saveData(DB); showToast("Ticket marqué comme réglé !"); go("tickets");
  });
  const bd=document.getElementById("btn-delete-ticket");
  if(bd) bd.addEventListener("click",async()=>{
    if(!confirm("Supprimer ce ticket ?")) return;
    DB.tickets=DB.tickets.filter(t=>t.id!==SEL.id);
    await saveData(DB); showToast("Ticket supprimé."); go("tickets");
  });
}

/* ═══════════════════════════════ MEMBERS ════════════════= */
function renderMembers(){
  return `
  ${navHtml("members")}
  <div class="page">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px">
      <h2 style="font-family:var(--serif);font-weight:400;font-size:26px">Membres</h2>
      <button class="btn btn-primary" id="btn-new-member">${ic("plus",15)} Nouveau</button>
    </div>
    <div class="member-list">
      ${DB.members.map(m=>{
        const mt=DB.tickets.filter(t=>t.memberId===m.id);
        const due=mt.filter(t=>!t.paid).reduce((s,t)=>s+t.total,0);
        return `
        <div class="member-card">
          <div class="member-avatar">${esc(m.name[0])}</div>
          <div class="member-info">
            <div class="member-name">${esc(m.name)}</div>
            <div class="member-email">${esc(m.email)}${m.phone?" · "+esc(m.phone):""}</div>
          </div>
          <div class="member-balance">
            <div class="member-due" style="color:${due>0?"var(--orange)":"var(--green)"}">${due>0?fmt(due)+" dû":"À jour"}</div>
            <div class="member-tickets">${mt.length} ticket${mt.length>1?"s":""}</div>
          </div>
          ${m.role!=="admin"?`<button class="btn-icon" data-del-member="${m.id}">${ic("trash",15)}</button>`:""}
        </div>`;
      }).join("")}
    </div>
  </div>`;
}
function bindMembers(){
  bindNav();
  document.getElementById("btn-new-member").addEventListener("click",()=>go("newMember"));
  document.querySelectorAll("[data-del-member]").forEach(b=>{
    b.addEventListener("click",async()=>{
      if(!confirm("Supprimer ce membre ?")) return;
      DB.members=DB.members.filter(m=>m.id!==b.dataset.delMember);
      await saveData(DB); showToast("Membre supprimé."); go("members");
    });
  });
}

/* ═══════════════════════════════ NEW MEMBER ══════════════ */
function renderNewMember(){
  return `
  ${subHeaderHtml("Nouveau membre")}
  <div class="page-xs">
    <div class="field"><label class="lbl">Nom complet *</label><input id="nm-name" class="inp" placeholder="Marie Dupont"/></div>
    <div class="field"><label class="lbl">E-mail *</label><input id="nm-email" class="inp" type="email"/></div>
    <div class="field"><label class="lbl">Téléphone</label><input id="nm-phone" class="inp" placeholder="06 xx xx xx xx"/></div>
    <div class="field"><label class="lbl">Mot de passe initial</label><input id="nm-pwd" class="inp" value="membre2024"/></div>
    <p style="font-size:12px;color:var(--faint);margin-top:-8px;margin-bottom:18px">Le membre se connecte avec cet e-mail et ce mot de passe.</p>
    <button class="btn btn-primary btn-full" id="btn-submit-member">${ic("user",15)} Créer le membre</button>
  </div>`;
}
function bindNewMember(){
  document.getElementById("btn-back").addEventListener("click",()=>go("members"));
  document.getElementById("btn-submit-member").addEventListener("click",async()=>{
    const name =document.getElementById("nm-name").value.trim();
    const email=document.getElementById("nm-email").value.trim();
    const phone=document.getElementById("nm-phone").value.trim();
    const pwd  =document.getElementById("nm-pwd").value.trim();
    if(!name||!email){ showToast("Nom et email requis.","err"); return; }
    if(DB.members.find(m=>m.email.toLowerCase()===email.toLowerCase())){ showToast("Email déjà utilisé.","err"); return; }
    DB.members=[...DB.members,{id:Date.now().toString(),name,email,phone,password:pwd,role:"member",createdAt:new Date().toISOString()}];
    await saveData(DB); showToast("Membre créé !"); go("members");
  });
}

        <pre>${e}</pre>
      </div>

}

init();
</script>

init();
</script>
