<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Réservation Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0D0F14;--bg2:#13161E;--bg3:#1A1E29;--bg4:#222739;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#F0EEE8;--muted:rgba(240,238,232,0.45);--muted2:rgba(240,238,232,0.25);
  --orange:#F4722B;--orange2:#F9A06E;--orange-dim:rgba(244,114,43,0.15);
  --green:#2ECC8A;--green-dim:rgba(46,204,138,0.12);
  --red:#E84040;--red-dim:rgba(232,64,64,0.12);
  --blue:#4E9EF5;--blue-dim:rgba(78,158,245,0.12);
  --yellow:#F5C842;
  --r:10px;--r2:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;padding-bottom:40px}

.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;height:56px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;letter-spacing:-0.5px}
.logo span{color:var(--orange)}
.live-badge{background:rgba(232,64,64,.15);border:1px solid rgba(232,64,64,.3);border-radius:50px;padding:4px 12px;font-size:11px;font-weight:700;color:var(--red);display:flex;align-items:center;gap:6px;margin-left:auto}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.container{max-width:600px;margin:0 auto;padding:20px 16px}

.hero{text-align:center;padding:28px 0 20px}
.hero-logo{max-height:70px;max-width:200px;margin-bottom:16px;border-radius:8px}
.hero h1{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;line-height:1.2;margin-bottom:8px}
.hero p{color:var(--muted);font-size:13px;line-height:1.6;max-width:420px;margin:0 auto}

.section{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);padding:18px 16px;margin-bottom:14px}
.section-title{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}

.flabel{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;display:block}
.finput{width:100%;padding:10px 13px;border:1.5px solid var(--border2);border-radius:var(--r);font-family:'Manrope',sans-serif;font-size:13px;background:var(--bg3);color:var(--text);outline:none;transition:border .2s;-webkit-appearance:none}
.finput:focus{border-color:var(--orange)}
.finput::placeholder{color:var(--muted2)}
.fgroup{margin-bottom:12px}

/* ARTICLES */
.art-card{background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--r);padding:10px 12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;transition:border-color .15s}
.art-card.selected{border-color:var(--orange);background:var(--orange-dim)}
.art-card.out-of-stock{opacity:.4}
.art-emoji{font-size:22px;flex-shrink:0;width:32px;text-align:center}
.art-info{flex:1;min-width:0}
.art-name{font-weight:700;font-size:13px}
.art-cat{font-size:11px;color:var(--muted);margin-top:1px}
.art-price{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:var(--orange);white-space:nowrap}
.art-stock-badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;background:var(--green-dim);color:var(--green);margin-top:3px;display:inline-block}
.art-stock-badge.low{background:var(--yellow-dim,rgba(245,200,66,.12));color:var(--yellow)}
.art-stock-badge.out{background:var(--red-dim);color:var(--red)}

.qty-ctrl{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qty-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border2);background:var(--bg4);color:var(--text);cursor:pointer;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .1s;touch-action:manipulation;-webkit-appearance:none}
.qty-btn:active{background:var(--orange);border-color:var(--orange)}
.qty-btn:disabled{opacity:.3;cursor:not-allowed}
.qty-num{font-weight:800;font-size:14px;min-width:20px;text-align:center}

/* PANIER RÉCAP */
.cart-summary{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.cart-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border)}
.cart-row:last-child{border-bottom:none;padding-top:8px}
.cart-total{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;color:var(--green)}
.cart-empty{text-align:center;padding:20px;color:var(--muted);font-size:13px}

/* BOUTON SUBMIT */
.submit-btn{width:100%;padding:16px;background:var(--orange);color:#fff;border:none;border-radius:var(--r2);font-family:'Manrope',sans-serif;font-size:15px;font-weight:800;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;touch-action:manipulation}
.submit-btn:active{opacity:.88;transform:scale(.99)}
.submit-btn:disabled{opacity:.4;cursor:not-allowed}

/* SUCCESS */
.success-screen{text-align:center;padding:40px 20px;display:none}
.success-icon{font-size:64px;margin-bottom:16px;animation:bounceIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes bounceIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.success-screen h2{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;margin-bottom:10px;color:var(--green)}
.success-screen p{color:var(--muted);font-size:13px;line-height:1.7;max-width:380px;margin:0 auto}

/* LOADING */
.spinner{width:32px;height:32px;border:3px solid var(--border2);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

.error-box{background:var(--red-dim);border:1px solid rgba(232,64,64,.25);border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--red);margin-bottom:12px;display:none}
.info-box{background:var(--blue-dim);border:1px solid rgba(78,158,245,.2);border-radius:var(--r);padding:10px 12px;font-size:12px;color:var(--blue);margin-bottom:12px}

.no-articles{text-align:center;padding:28px;color:var(--muted)}
.no-articles-icon{font-size:40px;margin-bottom:10px}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

@media(max-width:480px){
  .hero h1{font-size:20px}
  .container{padding:14px 12px}
  .section{padding:14px 12px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">FC<span>ÉVÉNEMENT</span></div>
  <div class="live-badge" id="live-badge" style="display:none">
    <div class="live-dot"></div> EN DIRECT
  </div>
</div>

<div class="container" id="main-container">
  <div style="text-align:center;padding:60px 20px">
    <div class="spinner"></div>
    <div style="color:var(--muted);font-size:13px">Chargement…</div>
  </div>
</div>

<script>
// ═══ PARAMS URL ══════════════════════════════════
const params=new URLSearchParams(window.location.search);
const SUPABASE_URL=params.get('org');
const SUPABASE_KEY=params.get('key');

if(!SUPABASE_URL||!SUPABASE_KEY){
  document.getElementById('main-container').innerHTML=`
    <div style="text-align:center;padding:60px 20px">
      <div style="font-size:48px;margin-bottom:16px">⚠️</div>
      <h2 style="font-family:'Syne',sans-serif;font-size:20px;margin-bottom:10px">Lien invalide</h2>
      <p style="color:var(--muted);font-size:13px">Ce lien de réservation est incomplet.<br>Demandez un nouveau lien à l'organisateur.</p>
    </div>`;
  throw new Error('Missing params');
}

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

// ═══ STATE ══════════════════════════════════════
let catalogue=[];
let settings={name:'FC Événement',resaTitle:'',resaMsg:'',resaConfirm:'',logo:null};
let cart={};// {id: qty}
let submitted=false;

// ═══ INIT ═══════════════════════════════════════
async function init(){
  try{
    // Charger settings
    const {data:s}=await sb.from('settings').select('data').limit(1).single();
    if(s?.data){Object.assign(settings,s.data);}

    // Charger catalogue (articles visibles en réservation)
    const {data:cat,error:catErr}=await sb.from('catalogue').select('*').eq('resa_visible',true).order('cat').order('name');
    if(catErr)throw catErr;
    catalogue=(cat||[]).map(a=>({...a,stock:(a.stock===undefined||a.stock===null)?null:Number(a.stock)}));

    render();
  }catch(e){
    document.getElementById('main-container').innerHTML=`
      <div style="text-align:center;padding:60px 20px">
        <div style="font-size:48px;margin-bottom:16px">❌</div>
        <h2 style="font-family:'Syne',sans-serif;font-size:20px;margin-bottom:10px">Erreur de connexion</h2>
        <p style="color:var(--muted);font-size:13px">${e.message||'Impossible de charger le formulaire.'}</p>
      </div>`;
  }
}

function getStockUsed(catId){
  return cart[catId]||0;
}
function getStockRemaining(art){
  if(art.stock===null||art.stock===undefined)return null;
  return Math.max(0,art.stock-getStockUsed(art.id));
}

function render(){
  const cont=document.getElementById('main-container');
  const title=settings.resaTitle||'Réservez vos articles live';
  const msg=settings.resaMsg||'Sélectionnez vos articles et envoyez votre réservation.';
  const logoHtml=settings.logo?`<img src="${settings.logo}" class="hero-logo" alt="${settings.name}">`:'';

  // Grouper par catégorie
  const cats={};
  catalogue.forEach(a=>{const c=a.cat||'Autre';if(!cats[c])cats[c]=[];cats[c].push(a);});

  const catSections=Object.entries(cats).map(([catName,arts])=>`
    <div style="margin-bottom:16px">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:8px;padding:0 2px">${catName}</div>
      ${arts.map(a=>{
        const rem=getStockRemaining(a);
        const isOut=rem!==null&&rem<=0;
        const isLow=rem!==null&&rem>0&&rem<=5;
        const qty=cart[a.id]||0;
        const stockBadge=rem===null?'':(isOut?`<span class="art-stock-badge out">Rupture</span>`:(isLow?`<span class="art-stock-badge low">${rem} restant${rem>1?'s':''}</span>`:`<span class="art-stock-badge">${rem} en stock</span>`));
        return `<div class="art-card${qty>0?' selected':''}${isOut?' out-of-stock':''}" id="art-${a.id}">
          <div class="art-emoji">${a.emoji||'📦'}</div>
          <div class="art-info">
            <div class="art-name">${a.name}</div>
            <div>${stockBadge}</div>
          </div>
          <div class="art-price">${a.price} €</div>
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="changeQty(${a.id},-1)" ${qty<=0?'disabled':''}${isOut&&qty<=0?' disabled':''}>−</button>
            <div class="qty-num" id="qty-${a.id}">${qty}</div>
            <button class="qty-btn" onclick="changeQty(${a.id},1)" ${isOut?' disabled':''}>+</button>
          </div>
        </div>`;
      }).join('')}
    </div>`).join('');

  cont.innerHTML=`
    <div class="hero">
      ${logoHtml}
      <h1>${title}</h1>
      <p>${msg}</p>
    </div>

    <div id="success-section" class="success-screen"></div>
    <div id="form-section">
      <div class="section">
        <div class="section-title">📦 Articles disponibles</div>
        ${catalogue.length
          ?catSections
          :`<div class="no-articles"><div class="no-articles-icon">📦</div><div>Aucun article disponible pour le moment.</div></div>`}
      </div>

      <div class="section">
        <div class="section-title">🛒 Mon panier</div>
        <div id="cart-summary" class="cart-summary">
          <div class="cart-empty">Sélectionnez des articles ci-dessus</div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">👤 Vos coordonnées</div>
        <div class="fgroup">
          <label class="flabel">Votre nom Facebook / prénom *</label>
          <input class="finput" id="client-name" placeholder="Ex: Marie Dupont" type="text" autocomplete="name">
        </div>
        <div class="fgroup">
          <label class="flabel">Téléphone ou email</label>
          <input class="finput" id="client-contact" placeholder="06 xx xx xx xx ou mail@exemple.fr" type="text" autocomplete="tel">
        </div>
        <div class="fgroup">
          <label class="flabel">Message ou précisions (optionnel)</label>
          <textarea class="finput" id="client-message" placeholder="Taille, couleur préférée, question…" style="min-height:80px;resize:vertical"></textarea>
        </div>
        <div id="error-box" class="error-box"></div>
        <button class="submit-btn" id="submit-btn" onclick="submitResa()">
          🛒 Envoyer ma réservation
        </button>
        <div style="text-align:center;font-size:11px;color:var(--muted2);margin-top:10px">
          Réservation sans engagement · Paiement à la remise
        </div>
      </div>
    </div>`;

  renderCart();
}

function changeQty(id,delta){
  const art=catalogue.find(a=>a.id===id);if(!art)return;
  const rem=getStockRemaining(art);
  const cur=cart[id]||0;
  const newQty=Math.max(0,cur+delta);
  if(delta>0&&rem!==null&&newQty>rem){showError('Stock insuffisant pour '+art.name);return;}
  if(newQty===0)delete cart[id];else cart[id]=newQty;

  // Update UI
  const qtyEl=document.getElementById('qty-'+id);
  const cardEl=document.getElementById('art-'+id);
  if(qtyEl)qtyEl.textContent=newQty;
  if(cardEl){
    cardEl.classList.toggle('selected',newQty>0);
    // Mettre à jour bouton −
    const btns=cardEl.querySelectorAll('.qty-btn');
    if(btns[0])btns[0].disabled=newQty<=0;
  }
  renderCart();
}

function renderCart(){
  const el=document.getElementById('cart-summary');if(!el)return;
  const keys=Object.keys(cart).filter(k=>cart[k]>0);
  if(!keys.length){el.innerHTML='<div class="cart-empty">Sélectionnez des articles ci-dessus</div>';return;}
  let total=0;
  const rows=keys.map(id=>{
    const art=catalogue.find(a=>a.id==id);if(!art)return'';
    const sub=art.price*cart[id];total+=sub;
    return `<div class="cart-row">
      <span>${art.emoji} ${art.name} <span style="color:var(--muted)">× ${cart[id]}</span></span>
      <span style="font-weight:700">${sub} €</span>
    </div>`;
  }).join('');
  el.innerHTML=rows+`<div class="cart-row" style="margin-top:4px">
    <span style="font-weight:700;font-size:14px">Total estimé</span>
    <span class="cart-total">${total} €</span>
  </div>`;
}

function showError(msg){
  const el=document.getElementById('error-box');if(!el)return;
  el.textContent='⚠ '+msg;el.style.display='block';
  setTimeout(()=>{el.style.display='none'},4000);
}

async function submitResa(){
  if(submitted)return;
  const name=(document.getElementById('client-name')?.value||'').trim();
  if(!name){showError('Votre nom est requis.');document.getElementById('client-name')?.focus();return;}
  const keys=Object.keys(cart).filter(k=>cart[k]>0);
  // On autorise la soumission sans article (message seul)
  const items=keys.map(id=>{
    const art=catalogue.find(a=>a.id==id);if(!art)return null;
    return{id:art.id,name:art.name,emoji:art.emoji,price:art.price,qty:cart[id]};
  }).filter(Boolean);
  const contact=(document.getElementById('client-contact')?.value||'').trim();
  const message=(document.getElementById('client-message')?.value||'').trim();
  const btn=document.getElementById('submit-btn');
  btn.disabled=true;btn.textContent='⏳ Envoi en cours…';
  try{
    const {error}=await sb.from('reservations').insert({
      client_name:name,
      client_contact:contact||null,
      items,
      message:message||null,
      status:'new',
      created_at:new Date().toISOString()
    });
    if(error)throw error;
    submitted=true;
    showSuccess(name);
  }catch(e){
    btn.disabled=false;btn.textContent='🛒 Envoyer ma réservation';
    showError('Erreur lors de l\'envoi : '+e.message);
  }
}

function showSuccess(name){
  const confirm=settings.resaConfirm||'Merci pour votre réservation ! Nous vous contacterons rapidement pour finaliser.';
  document.getElementById('form-section').style.display='none';
  const s=document.getElementById('success-section');
  s.style.display='block';
  s.innerHTML=`
    <div class="success-icon">✅</div>
    <h2>Réservation envoyée !</h2>
    <p><strong>${name}</strong>, votre réservation a bien été reçue.<br><br>${confirm}</p>
    <button onclick="newResa()" style="margin-top:24px;background:var(--bg3);border:1px solid var(--border2);color:var(--muted);padding:10px 24px;border-radius:50px;font-family:'Manrope',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s">
      Faire une autre réservation
    </button>`;
}

function newResa(){
  submitted=false;cart={};
  render();
}

init();
</script>
</body>
</html>
