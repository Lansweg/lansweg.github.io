<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GALACTIC PLINKO</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');

  :root {
    --gold:#FFD700;--gold2:#FFA500;--cyan:#00F5FF;--purple:#9B30FF;
    --dark:#050510;--panel:#0D0D2B;--red:#FF3A5C;--green:#00FF88;
    --glow-gold:0 0 10px #FFD700,0 0 30px #FFA500;
    --glow-cyan:0 0 10px #00F5FF,0 0 30px #00B8D9;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--dark);font-family:'Rajdhani',sans-serif;color:#fff;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(ellipse at 20% 10%,rgba(155,48,255,.15) 0%,transparent 50%),
      radial-gradient(ellipse at 80% 90%,rgba(0,245,255,.1) 0%,transparent 50%);
  }
  .stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .star{position:absolute;background:white;border-radius:50%;animation:twinkle var(--d) ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}

  #app{
    position:relative;z-index:1;width:100%;max-width:480px;
    padding:12px 10px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;
  }

  /* Header */
  .header{width:100%;text-align:center;padding:8px 0 4px;}
  .logo{
    font-family:'Orbitron',monospace;font-size:clamp(22px,7vw,32px);font-weight:900;letter-spacing:4px;
    background:linear-gradient(135deg,#FFD700,#FF8C00,#FF3A5C);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    animation:logoPulse 3s ease-in-out infinite;
  }
  @keyframes logoPulse{
    0%,100%{filter:drop-shadow(0 0 10px rgba(255,165,0,.6))}
    50%{filter:drop-shadow(0 0 22px rgba(255,165,0,1))}
  }
  .tagline{font-size:11px;letter-spacing:3px;color:var(--cyan);opacity:.7;text-transform:uppercase;margin-top:2px;}

  /* Stats */
  .stats-bar{width:100%;display:flex;gap:8px;}
  .stat-box{
    flex:1;background:var(--panel);border:1px solid rgba(0,245,255,.2);
    border-radius:10px;padding:8px 10px;text-align:center;position:relative;overflow:hidden;
  }
  .stat-box::after{
    content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.5;
  }
  .stat-box.pop{animation:statPop .35s cubic-bezier(.34,1.56,.64,1);}
  @keyframes statPop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
  .stat-label{font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.4);text-transform:uppercase;}
  .stat-value{font-family:'Orbitron',monospace;font-size:clamp(14px,4vw,18px);font-weight:700;color:var(--gold);text-shadow:var(--glow-gold);}
  .stat-value.win{color:var(--green);text-shadow:0 0 10px var(--green);}
  .stat-value.loss{color:var(--red);text-shadow:0 0 10px var(--red);}

  /* Canvas */
  .canvas-wrap{
    width:100%;background:var(--panel);border:1px solid rgba(155,48,255,.3);
    border-radius:16px;overflow:hidden;position:relative;
    box-shadow:0 0 30px rgba(155,48,255,.15),inset 0 0 40px rgba(0,0,0,.5);
  }
  .canvas-wrap.shake{animation:shake .4s cubic-bezier(.36,.07,.19,.97);}
  @keyframes shake{
    10%,90%{transform:translate(-2px,1px) rotate(-.3deg)}
    20%,80%{transform:translate(3px,-1px) rotate(.3deg)}
    30%,50%,70%{transform:translate(-3px,2px) rotate(-.2deg)}
    40%,60%{transform:translate(3px,-2px) rotate(.2deg)}
    100%{transform:translate(0,0) rotate(0)}
  }
  canvas{display:block;width:100%;height:auto;}
  #confettiCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:10;}

  /* Controls */
  .controls{
    width:100%;background:var(--panel);border:1px solid rgba(0,245,255,.15);
    border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;
  }
  .bet-row{display:flex;align-items:center;gap:8px;}
  .bet-label{font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.5);text-transform:uppercase;white-space:nowrap;min-width:40px;}
  .bet-input{
    flex:1;background:rgba(0,0,0,.4);border:1px solid rgba(0,245,255,.25);border-radius:8px;
    color:var(--gold);font-family:'Orbitron',monospace;font-size:16px;font-weight:700;
    padding:8px 12px;outline:none;text-align:center;-moz-appearance:textfield;
  }
  .bet-input::-webkit-inner-spin-button,.bet-input::-webkit-outer-spin-button{-webkit-appearance:none;}
  .bet-input:focus{border-color:var(--cyan);box-shadow:var(--glow-cyan);}
  .quick-bets{display:flex;gap:6px;}
  .qb{
    flex:1;background:rgba(0,245,255,.07);border:1px solid rgba(0,245,255,.2);border-radius:7px;
    color:var(--cyan);font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;
    letter-spacing:1px;padding:6px 2px;cursor:pointer;transition:all .15s;text-align:center;
  }
  .qb:hover,.qb:active{background:rgba(0,245,255,.18);box-shadow:var(--glow-cyan);}
  .risk-row{display:flex;gap:8px;}
  .risk-btn{
    flex:1;padding:8px 4px;border-radius:8px;border:1px solid;
    font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;
    cursor:pointer;transition:all .15s;text-transform:uppercase;
  }
  .risk-btn.low{border-color:rgba(0,255,136,.4);color:var(--green);background:rgba(0,255,136,.05);}
  .risk-btn.med{border-color:rgba(255,165,0,.4);color:var(--gold2);background:rgba(255,165,0,.05);}
  .risk-btn.high{border-color:rgba(255,58,92,.4);color:var(--red);background:rgba(255,58,92,.05);}
  .risk-btn.active{background:rgba(255,255,255,.12)!important;}
  .risk-btn.low.active{box-shadow:0 0 15px rgba(0,255,136,.4);border-color:var(--green);}
  .risk-btn.med.active{box-shadow:0 0 15px rgba(255,165,0,.4);border-color:var(--gold2);}
  .risk-btn.high.active{box-shadow:0 0 15px rgba(255,58,92,.4);border-color:var(--red);}
  .drop-btn{
    width:100%;padding:16px;border-radius:12px;border:none;
    background:linear-gradient(135deg,#9B30FF,#6A0DAD);color:white;
    font-family:'Orbitron',monospace;font-size:16px;font-weight:900;letter-spacing:3px;
    cursor:pointer;transition:all .15s;text-transform:uppercase;
    box-shadow:0 4px 20px rgba(155,48,255,.4);position:relative;overflow:hidden;
  }
  .drop-btn::before{
    content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transition:left .4s;
  }
  .drop-btn:hover::before{left:100%;}
  .drop-btn:hover{transform:translateY(-1px);box-shadow:0 6px 25px rgba(155,48,255,.6);}
  .drop-btn:active{transform:translateY(1px);}

  /* Mute */
  .mute-btn{
    position:absolute;top:12px;right:12px;z-index:10;
    background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);
    border-radius:8px;color:rgba(255,255,255,.6);font-size:18px;
    padding:5px 9px;cursor:pointer;transition:all .2s;
  }
  .mute-btn:hover{background:rgba(255,255,255,.1);}

  /* History */
  .history-wrap{width:100%;}
  .history-title{font-size:10px;letter-spacing:3px;color:rgba(255,255,255,.3);text-transform:uppercase;margin-bottom:6px;padding-left:4px;}
  .history-list{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
  .history-list::-webkit-scrollbar{display:none;}
  .hist-item{
    flex-shrink:0;padding:4px 9px;border-radius:6px;
    font-family:'Orbitron',monospace;font-size:11px;font-weight:700;border:1px solid;
    animation:histPop .3s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes histPop{from{transform:scale(0) rotate(-10deg)}to{transform:scale(1) rotate(0)}}
  .hist-item.win{color:var(--green);border-color:rgba(0,255,136,.3);background:rgba(0,255,136,.07);}
  .hist-item.loss{color:var(--red);border-color:rgba(255,58,92,.3);background:rgba(255,58,92,.07);}

  /* Toast */
  .toast{
    position:fixed;top:50%;left:50%;
    transform:translate(-50%,-50%) scale(.8);
    background:var(--panel);border:2px solid var(--gold);border-radius:16px;
    padding:20px 40px;text-align:center;z-index:200;opacity:0;
    transition:all .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;
  }
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .toast-multi{font-family:'Orbitron',monospace;font-size:40px;font-weight:900;color:var(--gold);}
  .toast-label{font-size:13px;letter-spacing:3px;color:rgba(255,255,255,.6);margin-top:4px;}

  /* Float text */
  .float-text{
    position:fixed;pointer-events:none;z-index:300;
    font-family:'Orbitron',monospace;font-size:22px;font-weight:900;
    animation:floatUp 1.3s ease-out forwards;
    text-shadow:0 2px 10px rgba(0,0,0,.5);
  }
  @keyframes floatUp{
    0%{opacity:1;transform:translateY(0) scale(1);}
    80%{opacity:1;}
    100%{opacity:0;transform:translateY(-90px) scale(1.4);}
  }

  /* Screen flash */
  #screenFlash{position:fixed;inset:0;z-index:150;pointer-events:none;opacity:0;transition:opacity .08s;}

  /* Multiplier big reveal */
  .mult-reveal{
    position:absolute;bottom:13%;left:50%;transform:translateX(-50%);
    font-family:'Orbitron',monospace;font-size:clamp(26px,8vw,44px);font-weight:900;
    pointer-events:none;z-index:20;white-space:nowrap;
    animation:multReveal 1.5s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes multReveal{
    0%{opacity:0;transform:translateX(-50%) scale(.3) rotate(-12deg);}
    30%{opacity:1;transform:translateX(-50%) scale(1.25) rotate(2deg);}
    55%{transform:translateX(-50%) scale(.95) rotate(-1deg);}
    80%{opacity:1;transform:translateX(-50%) scale(1);}
    100%{opacity:0;transform:translateX(-50%) scale(.85) translateY(-24px);}
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div id="screenFlash"></div>

<div id="app">
  <div class="header">
    <div class="logo">⬡ PLINKO ⬡</div>
    <div class="tagline">Galactic Drop · Win Big</div>
  </div>

  <div class="stats-bar">
    <div class="stat-box" id="boxBalance"><div class="stat-label">💰 Balance</div><div class="stat-value" id="balance">1 000</div></div>
    <div class="stat-box" id="boxBet"><div class="stat-label">🎯 Mise</div><div class="stat-value" id="last-bet">—</div></div>
    <div class="stat-box" id="boxWin"><div class="stat-label">🏆 Gain</div><div class="stat-value" id="last-win">—</div></div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="gameCanvas"></canvas>
    <canvas id="confettiCanvas"></canvas>
  </div>

  <div class="controls">
    <div class="bet-row">
      <span class="bet-label">Mise</span>
      <input type="number" class="bet-input" id="betInput" value="10" min="1">
    </div>
    <div class="quick-bets">
      <button class="qb" onclick="setQuickBet(.5)">½</button>
      <button class="qb" onclick="setQuickBet(2)">x2</button>
      <button class="qb" onclick="setQuickBet('min')">Min</button>
      <button class="qb" onclick="setQuickBet('max')">Max</button>
      <button class="qb" onclick="setQuickBet('all')">Tout</button>
    </div>
    <div class="bet-row" style="margin-top:2px">
      <span class="bet-label">Risque</span>
      <div class="risk-row" style="flex:1">
        <button class="risk-btn low active" onclick="setRisk('low',this)">Faible</button>
        <button class="risk-btn med" onclick="setRisk('med',this)">Moyen</button>
        <button class="risk-btn high" onclick="setRisk('high',this)">Élevé</button>
      </div>
    </div>
    <button class="drop-btn" id="dropBtn" onclick="dropBall()">▼ LANCER</button>
  </div>

  <div class="history-wrap">
    <div class="history-title">Dernières parties</div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<button class="mute-btn" id="muteBtn" onclick="toggleMute()">🔊</button>

<div class="toast" id="toast">
  <div class="toast-multi" id="toastMulti"></div>
  <div class="toast-label" id="toastLabel"></div>
</div>

<script>
// ══ STARS ══
(function(){
  const c=document.getElementById('stars');
  for(let i=0;i<80;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2+.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*4}s`;
    c.appendChild(s);
  }
})();

// ══ AUDIO ENGINE (Web Audio API, zero deps) ══
let audioCtx=null, muted=false;
function getAC(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq,type,dur,vol=.15,atk=.005,dec=.08){
  if(muted)return;
  try{
    const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    o.type=type;o.frequency.setValueAtTime(freq,ac.currentTime);
    g.gain.setValueAtTime(0,ac.currentTime);
    g.gain.linearRampToValueAtTime(vol,ac.currentTime+atk);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+atk+dec+dur);
    o.start();o.stop(ac.currentTime+atk+dec+dur+.05);
  }catch(e){}
}
function noise(dur,vol=.06,freq=2000){
  if(muted)return;
  try{
    const ac=getAC(),n=ac.sampleRate*dur,b=ac.createBuffer(1,n,ac.sampleRate);
    const d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();
    f.type='bandpass';f.frequency.value=freq;f.Q.value=.6;
    s.buffer=b;s.connect(f);f.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(vol,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
    s.start();s.stop(ac.currentTime+dur);
  }catch(e){}
}
// Sound presets
const SFX={
  drop:()=>{ tone(380,'sine',.12,.18); tone(520,'sine',.08,.08,.02,.06); },
  peg: ()=>{ noise(.05,.035,1800+Math.random()*1200); tone(900+Math.random()*500,'triangle',.03,.04); },
  land:()=>{ tone(330,'sine',.18,.16); tone(440,'sine',.12,.1,.01,.1); },
  winBig:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,'square',.16,.13),i*75)),
  jackpot:()=>{
    [523,659,784,1047,1319,1568].forEach((f,i)=>setTimeout(()=>tone(f,'sawtooth',.18,.15),i*55));
    setTimeout(()=>tone(2093,'sine',.3,.2),380);
  },
  loss:()=>{ tone(200,'sawtooth',.18,.1); setTimeout(()=>tone(150,'sawtooth',.15,.08),110); },
  click:()=>tone(600,'square',.03,.07),
};

function toggleMute(){
  muted=!muted;
  document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';
  if(!muted)SFX.click();
}

// ══ GAME STATE ══
let balance=1000,risk='low',balls=[],particles=[],confettis=[],pegs=[],slots=[],history=[];
const ROWS=12,BR=7,PR=5;
const MULT={
  low: [5.6,2.1,1.1,1,.5,.3,.5,1,1.1,2.1,5.6],
  med: [13,3,1.3,.7,.4,.2,.4,.7,1.3,3,13],
  high:[29,4,1.5,.3,.2,.1,.2,.3,1.5,4,29]
};
const COL_LOW =['#00FF88','#4ade80','#86efac','#fde68a','#fca5a5','#f87171','#fca5a5','#fde68a','#86efac','#4ade80','#00FF88'];
const COL_MED =['#00FF88','#4ade80','#fde68a','#fca5a5','#f87171','#f43f5e','#f87171','#fca5a5','#fde68a','#4ade80','#00FF88'];
const COL_HIGH=['#00FF88','#4ade80','#fde68a','#f87171','#f43f5e','#dc2626','#f43f5e','#f87171','#fde68a','#4ade80','#00FF88'];

// ══ CANVAS ══
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
const cc=document.getElementById('confettiCanvas'),cctx=cc.getContext('2d');

function resize(){
  const w=canvas.parentElement.clientWidth;
  canvas.width=cc.width=w;
  canvas.height=cc.height=w*1.1;
  build();
}
function build(){
  const W=canvas.width,H=canvas.height;
  pegs=[];slots=[];
  const tp=H*.06,bp=H*.14,rh=(H-tp-bp)/(ROWS-1);
  for(let r=0;r<ROWS;r++){
    const cnt=r+3,y=tp+r*rh,tw=(cnt-1)*(W/(ROWS+2)),sx=(W-tw)/2;
    for(let c=0;c<cnt;c++) pegs.push({x:sx+c*(W/(ROWS+2)),y,glow:0});
  }
  const sc=MULT[risk].length,lc=ROWS+2,lw=(lc-1)*(W/(ROWS+2)),ls=(W-lw)/2,sw=lw/(sc-1);
  const pal=risk==='low'?COL_LOW:risk==='med'?COL_MED:COL_HIGH;
  for(let i=0;i<sc;i++) slots.push({x:ls+i*sw,y:H-bp,w:sw*.88,mult:MULT[risk][i],color:pal[i],flash:0,scale:1});
}

// ══ PARTICLES ══
function spawnPart(x,y,col,n=12){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=1.5+Math.random()*3.5;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,life:1,decay:.025+Math.random()*.025,r:2+Math.random()*3,color:col});
  }
}
function spawnConf(x,y,n=45){
  const cols=['#FFD700','#FF3A5C','#00F5FF','#00FF88','#9B30FF','#FF8C00','#fff'];
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=3+Math.random()*6;
    confettis.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3.5,life:1,decay:.011+Math.random()*.01,w:5+Math.random()*8,h:3+Math.random()*4,rot:Math.random()*Math.PI*2,rotV:(Math.random()-.5)*.28,color:cols[Math.floor(Math.random()*cols.length)]});
  }
}

// ══ DRAW ══
function draw(){
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(10,10,35,.5)';ctx.fillRect(0,0,W,H);

  // Pegs
  pegs.forEach(p=>{
    ctx.beginPath();ctx.arc(p.x,p.y,PR,0,Math.PI*2);
    const g=ctx.createRadialGradient(p.x-1,p.y-1,0,p.x,p.y,PR);
    g.addColorStop(0,'#fff');g.addColorStop(.5,'#a0c4ff');g.addColorStop(1,'#3a6bc4');
    ctx.fillStyle=g;
    ctx.shadowBlur=p.glow>0?14*p.glow:5;
    ctx.shadowColor=p.glow>0?`rgba(200,230,255,${p.glow})`:'rgba(160,196,255,.35)';
    ctx.fill();ctx.shadowBlur=0;
    if(p.glow>0)p.glow=Math.max(0,p.glow-.07);
  });

  // Slots
  const sh=H*.11;
  slots.forEach(s=>{
    const x=s.x-s.w/2,y=s.y;
    ctx.save();
    if(s.scale!==1){ctx.translate(s.x,y+sh/2);ctx.scale(s.scale,s.scale);ctx.translate(-s.x,-(y+sh/2));}
    if(s.flash>0){
      ctx.globalAlpha=Math.min(s.flash,.7);ctx.fillStyle=s.color;
      ctx.beginPath();ctx.roundRect(x,y,s.w,sh,6);ctx.fill();ctx.globalAlpha=1;
      s.flash=Math.max(0,s.flash-.045);
    }
    ctx.strokeStyle=s.color;ctx.lineWidth=1.5;ctx.globalAlpha=.6;
    ctx.beginPath();ctx.roundRect(x,y,s.w,sh,6);ctx.stroke();ctx.globalAlpha=1;
    ctx.fillStyle=s.color+'18';ctx.beginPath();ctx.roundRect(x,y,s.w,sh,6);ctx.fill();
    ctx.fillStyle=s.color;
    ctx.font=`bold ${Math.max(9,s.w*.22)}px Orbitron,monospace`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowBlur=s.flash>0?10:0;ctx.shadowColor=s.color;
    ctx.fillText(s.mult+'x',s.x,y+sh/2);ctx.shadowBlur=0;
    ctx.restore();
    if(s.scale>1)s.scale=Math.max(1,s.scale-.018);
  });

  // Particles
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.vx*=.97;p.life-=p.decay;
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;

  // Balls
  balls.forEach(b=>{
    if(b.trail)b.trail.forEach((t,i)=>{
      ctx.globalAlpha=(i/b.trail.length)*.3;
      ctx.fillStyle='rgba(255,215,0,1)';
      ctx.beginPath();ctx.arc(t.x,t.y,BR*.55*(i/b.trail.length),0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;
    ctx.beginPath();ctx.arc(b.x,b.y,BR,0,Math.PI*2);
    const g=ctx.createRadialGradient(b.x-2,b.y-2,0,b.x,b.y,BR);
    g.addColorStop(0,'#fff');g.addColorStop(.4,'#FFD700');g.addColorStop(1,'#FF8C00');
    ctx.fillStyle=g;ctx.shadowBlur=18;ctx.shadowColor='#FFD700';ctx.fill();ctx.shadowBlur=0;
  });

  // Confetti
  cctx.clearRect(0,0,cc.width,cc.height);
  confettis=confettis.filter(c=>c.life>0);
  confettis.forEach(c=>{
    c.x+=c.vx;c.y+=c.vy;c.vy+=.14;c.vx*=.99;c.rot+=c.rotV;c.life-=c.decay;
    cctx.save();cctx.globalAlpha=c.life;cctx.translate(c.x,c.y);cctx.rotate(c.rot);
    cctx.fillStyle=c.color;cctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);cctx.restore();
  });
}

// ══ PHYSICS ══
let lastPegSnd=0;
function update(){
  balls=balls.filter(b=>!b.done);
  balls.forEach(b=>{
    if(!b.trail)b.trail=[];
    b.trail.push({x:b.x,y:b.y});if(b.trail.length>10)b.trail.shift();
    b.vy+=.38;b.x+=b.vx;b.y+=b.vy;
    if(b.x<BR){b.x=BR;b.vx*=-.38;}
    if(b.x>canvas.width-BR){b.x=canvas.width-BR;b.vx*=-.38;}
    pegs.forEach(p=>{
      const dx=b.x-p.x,dy=b.y-p.y,dist=Math.sqrt(dx*dx+dy*dy),md=BR+PR;
      if(dist<md&&dist>0){
        const nx=dx/dist,ny=dy/dist;
        b.x=p.x+nx*(md+.5);b.y=p.y+ny*(md+.5);
        const dot=b.vx*nx+b.vy*ny;
        b.vx=(b.vx-2*dot*nx)*.72+(Math.random()-.5)*1.2;
        b.vy=(b.vy-2*dot*ny)*.72;if(b.vy<0)b.vy=Math.abs(b.vy);
        p.glow=1;
        spawnPart(p.x,p.y,'rgba(180,220,255,.7)',3);
        const now=Date.now();if(now-lastPegSnd>55){SFX.peg();lastPegSnd=now;}
      }
    });
    if(b.y>canvas.height-canvas.height*.14&&!b.counted){
      b.counted=true;
      const s=slots.reduce((a,s)=>Math.abs(s.x-b.x)<Math.abs(a.x-b.x)?s:a);
      s.flash=1.5;s.scale=1.22;
      const gain=Math.round(b.bet*s.mult*100)/100;
      balance+=gain;
      onResult(b.bet,gain,s.mult,b.x,b.y,s.color);
      setTimeout(()=>b.done=true,400);
    }
    if(b.y>canvas.height+40)b.done=true;
  });
}

function onResult(bet,gain,mult,bx,by,color){
  const net=gain-bet,isWin=gain>=bet;
  const winEl=document.getElementById('last-win');
  winEl.textContent=(isWin?'+':'')+fmtNum(net)+' ('+mult+'x)';
  winEl.className='stat-value '+(isWin?'win':'loss');
  document.getElementById('balance').textContent=fmtNum(balance);
  pop('boxBalance');pop(isWin?'boxWin':'boxBet');
  addHistory(gain,bet,mult);
  spawnPart(bx,canvas.height-canvas.height*.1,color,22);
  if(mult>=10){
    SFX.jackpot();
    spawnConf(canvas.width/2,canvas.height*.25,90);
    flash(color,.45);shake();
    showToast(mult+'x','🎉 JACKPOT !',color);
    floatText('+'+fmtNum(net),bx,by,'#FFD700');
    multReveal(mult+'x',color);
  }else if(mult>=3){
    SFX.winBig();
    spawnConf(canvas.width/2,canvas.height*.25,40);
    flash(color,.22);
    showToast(mult+'x','🚀 VICTOIRE !',color);
    floatText('+'+fmtNum(net),bx,by,'#00FF88');
    multReveal(mult+'x',color);
  }else if(isWin){
    SFX.land();
    floatText('+'+fmtNum(net),bx,by,'#4ade80');
  }else{
    SFX.loss();
    floatText(fmtNum(net),bx,by,'#FF3A5C');
  }
}

// ══ GAME LOOP ══
function loop(){update();draw();requestAnimationFrame(loop);}
loop();

// ══ DROP ══
function dropBall(){
  getAC();
  const bet=parseFloat(document.getElementById('betInput').value)||10;
  if(bet>balance){showToast('Solde insuffisant','','#FF3A5C');SFX.loss();return;}
  if(bet<=0)return;
  SFX.drop();
  balance-=bet;
  document.getElementById('balance').textContent=fmtNum(balance);
  document.getElementById('last-bet').textContent=fmtNum(bet);
  document.getElementById('last-win').textContent='…';
  document.getElementById('last-win').className='stat-value';
  const btn=document.getElementById('dropBtn');
  btn.style.transform='scale(.94)';setTimeout(()=>btn.style.transform='',120);
  balls.push({x:canvas.width/2+(Math.random()-.5)*26,y:pegs[0]?pegs[0].y-30:20,vx:(Math.random()-.5)*1.5,vy:1,bet,counted:false,done:false});
}

// ══ FX HELPERS ══
function flash(col,a){
  const el=document.getElementById('screenFlash');
  el.style.background=col;el.style.opacity=a;
  setTimeout(()=>el.style.opacity=0,130);
}
function shake(){
  const w=document.getElementById('canvasWrap');
  w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');
  setTimeout(()=>w.classList.remove('shake'),500);
}
function pop(id){
  const el=document.getElementById(id);
  el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
}
function floatText(txt,cx,cy,col){
  const el=document.createElement('div');el.className='float-text';
  el.textContent=txt;el.style.color=col;el.style.textShadow=`0 0 14px ${col}`;
  const r=canvas.getBoundingClientRect(),sx=r.width/canvas.width,sy=r.height/canvas.height;
  el.style.left=(r.left+cx*sx-30)+'px';
  el.style.top=(r.top+window.scrollY+cy*sy-25)+'px';
  document.body.appendChild(el);setTimeout(()=>el.remove(),1400);
}
function multReveal(txt,col){
  const w=document.getElementById('canvasWrap');
  const old=w.querySelector('.mult-reveal');if(old)old.remove();
  const el=document.createElement('div');el.className='mult-reveal';el.textContent=txt;
  el.style.color=col;el.style.textShadow=`0 0 22px ${col},0 0 44px ${col}`;
  w.appendChild(el);setTimeout(()=>el.remove(),1600);
}
let toastT;
function showToast(m,l,col){
  const t=document.getElementById('toast');
  document.getElementById('toastMulti').textContent=m;
  document.getElementById('toastLabel').textContent=l;
  document.getElementById('toastMulti').style.color=col;
  t.style.borderColor=col;t.style.boxShadow=`0 0 40px ${col}55`;
  t.classList.add('show');clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),1900);
}

// ══ CONTROLS ══
function setQuickBet(m){
  SFX.click();
  const el=document.getElementById('betInput'),v=parseFloat(el.value)||10;
  if(m===.5)el.value=Math.max(1,Math.floor(v*.5));
  else if(m===2)el.value=Math.min(balance,Math.floor(v*2));
  else if(m==='min')el.value=1;
  else if(m==='max')el.value=Math.min(balance,1000);
  else if(m==='all')el.value=Math.floor(balance);
}
function setRisk(r,btn){
  SFX.click();risk=r;
  document.querySelectorAll('.risk-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');build();
}
function addHistory(gain,bet,mult){
  history.unshift({gain,bet,mult});if(history.length>20)history.pop();
  const list=document.getElementById('historyList');
  list.innerHTML=history.map(h=>`<div class="hist-item ${h.gain>=h.bet?'win':'loss'}">${h.mult}x</div>`).join('');
}
function fmtNum(n){return Math.round(n).toLocaleString('fr-FR');}

// ══ INIT ══
window.addEventListener('resize',resize);resize();
document.addEventListener('touchstart',getAC,{once:true});
</script>
