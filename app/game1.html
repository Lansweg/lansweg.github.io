<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALACTIC PLINKO PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --gold:#FFD700;
  --gold2:#FFA500;
  --cyan:#00F5FF;
  --purple:#9B30FF;
  --dark:#050510;
  --panel:#0D0D2B;
  --red:#FF3A5C;
  --green:#00FF88;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:radial-gradient(circle at top,#151530,#050510);
  font-family:'Rajdhani',sans-serif;
  color:white;
  overflow-x:hidden;
  min-height:100vh;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%,rgba(155,48,255,.15),transparent 30%),
    radial-gradient(circle at 80% 80%,rgba(0,245,255,.12),transparent 30%);
  pointer-events:none;
}

#app{
  width:min(1500px,95vw);
  margin:auto;
  padding:20px;
  display:grid;
  grid-template-columns:340px 1fr;
  gap:20px;
}

.side-panel{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.panel-card{
  background:rgba(13,13,43,.95);
  border:1px solid rgba(0,245,255,.12);
  border-radius:18px;
  padding:20px;
  box-shadow:0 0 25px rgba(0,0,0,.4);
}

.panel-title{
  font-family:'Orbitron';
  color:var(--cyan);
  margin-bottom:15px;
  letter-spacing:2px;
  font-size:14px;
}

.panel-text{
  color:rgba(255,255,255,.7);
  line-height:1.6;
}

.key-row{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.best-multi{
  text-align:center;
  font-size:48px;
  font-family:'Orbitron';
  color:var(--gold);
  text-shadow:0 0 20px var(--gold);
}

.main{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.header{
  text-align:center;
}

.logo{
  font-family:'Orbitron';
  font-size:48px;
  font-weight:900;
  letter-spacing:6px;
  background:linear-gradient(90deg,#FFD700,#FF8C00,#FF3A5C);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.tagline{
  color:var(--cyan);
  letter-spacing:4px;
  font-size:12px;
  opacity:.7;
}

.stats-bar{
  display:flex;
  gap:10px;
}

.stat-box{
  flex:1;
  background:rgba(13,13,43,.95);
  border-radius:14px;
  padding:15px;
  text-align:center;
  border:1px solid rgba(0,245,255,.1);
}

.stat-label{
  color:rgba(255,255,255,.4);
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.stat-value{
  font-size:22px;
  font-family:'Orbitron';
  margin-top:5px;
  color:var(--gold);
}

.canvas-wrap{
  position:relative;
  background:
  linear-gradient(
  180deg,
  rgba(25,25,60,.95),
  rgba(5,5,20,.98)
  );

  border-radius:20px;
  overflow:hidden;
  border:1px solid rgba(155,48,255,.25);
  backdrop-filter:blur(8px);

  box-shadow:
  0 0 40px rgba(155,48,255,.2),
  inset 0 0 50px rgba(0,0,0,.5);
}

canvas{
  display:block;
  width:100%;
}

.controls{
  background:rgba(13,13,43,.95);
  border-radius:18px;
  padding:20px;
  border:1px solid rgba(0,245,255,.1);
  display:flex;
  flex-direction:column;
  gap:15px;
}

.bet-row{
  display:flex;
  gap:10px;
  align-items:center;
}

.bet-label{
  min-width:70px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:rgba(255,255,255,.5);
}

.bet-input{
  flex:1;
  background:#080815;
  border:1px solid rgba(0,245,255,.2);
  border-radius:10px;
  padding:12px;
  color:var(--gold);
  font-size:18px;
  text-align:center;
  font-family:'Orbitron';
}

.quick-bets{
  display:flex;
  gap:8px;
}

.qb{
  flex:1;
  background:rgba(0,245,255,.08);
  border:1px solid rgba(0,245,255,.15);
  color:var(--cyan);
  border-radius:8px;
  padding:8px;
  cursor:pointer;
  transition:.2s;
}

.qb:hover{
  transform:translateY(-2px);
  box-shadow:0 0 15px rgba(0,245,255,.3);
}

.risk-row{
  display:flex;
  gap:8px;
  flex:1;
}

.risk-btn{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:bold;
  letter-spacing:1px;
  transition:.2s;
}

.low{background:#003d22;color:#00FF88;}
.med{background:#4d3400;color:#FFD700;}
.high{background:#4a0010;color:#FF3A5C;}

.active{
  transform:scale(1.05);
  box-shadow:0 0 20px rgba(255,255,255,.2);
}

.drop-btn{
  padding:18px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#9B30FF,#6A0DAD);
  color:white;
  font-family:'Orbitron';
  font-size:20px;
  letter-spacing:4px;
  cursor:pointer;
  transition:.2s;
  box-shadow:0 0 25px rgba(155,48,255,.5);
}

.drop-btn:hover{
  transform:translateY(-3px);
  letter-spacing:5px;
}

.history-list{
  display:flex;
  gap:8px;
  overflow:auto;
}

.hist-item{
  padding:8px 12px;
  border-radius:8px;
  font-family:'Orbitron';
  flex-shrink:0;
}

.win{
  background:rgba(0,255,136,.15);
  color:#00FF88;
}

.loss{
  background:rgba(255,58,92,.15);
  color:#FF3A5C;
}

@media(max-width:900px){

  #app{
    grid-template-columns:1fr;
    width:100%;
    padding:12px;
  }

  .logo{
    font-size:32px;
  }

  .stats-bar{
    flex-direction:column;
  }

}

</style>
</head>

<body>

<div id="app">

  <div class="side-panel">

    <div class="panel-card">
      <div class="panel-title">🚀 GALACTIC MODE</div>

      <div class="panel-text">
        Lance des sphères cosmiques et tente de décrocher les multiplicateurs ultimes.
      </div>
    </div>

    <div class="panel-card">
      <div class="panel-title">🎮 COMMANDES</div>

      <div class="key-row">
        <span>Espace</span>
        <span>Lancer</span>
      </div>

      <div class="key-row">
        <span>1 / 2 / 3</span>
        <span>Risque</span>
      </div>
    </div>

    <div class="panel-card">
      <div class="panel-title">🏆 RECORD</div>

      <div class="best-multi" id="bestMulti">
        0x
      </div>
    </div>

  </div>

  <div class="main">

    <div class="header">
      <div class="logo">⬡ PLINKO ⬡</div>
      <div class="tagline">GALACTIC DROP</div>
    </div>

    <div class="stats-bar">

      <div class="stat-box">
        <div class="stat-label">Balance</div>
        <div class="stat-value" id="balance">1000</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">Dernier gain</div>
        <div class="stat-value" id="lastWin">0</div>
      </div>

    </div>

    <div class="canvas-wrap">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div class="controls">

      <div class="bet-row">
        <span class="bet-label">Mise</span>
        <input type="number" id="betInput" class="bet-input" value="10">
      </div>

      <div class="quick-bets">
        <button class="qb" onclick="quick(.5)">½</button>
        <button class="qb" onclick="quick(2)">x2</button>
        <button class="qb" onclick="allIn()">ALL</button>
      </div>

      <div class="bet-row">

        <span class="bet-label">Risque</span>

        <div class="risk-row">
          <button class="risk-btn low active" onclick="setRisk('low',this)">Faible</button>
          <button class="risk-btn med" onclick="setRisk('med',this)">Moyen</button>
          <button class="risk-btn high" onclick="setRisk('high',this)">Élevé</button>
        </div>

      </div>

      <button class="drop-btn" onclick="dropBall()">
        ▼ LANCER
      </button>

    </div>

    <div class="history-list" id="history"></div>

  </div>

</div>

<script>

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W,H;

function resize(){

  W = canvas.parentElement.clientWidth;

  H = window.innerWidth > 900
    ? W * .62
    : W * 1.1;

  canvas.width = W;
  canvas.height = H;

}

window.addEventListener('resize',resize);
resize();

let balance = 1000;
let risk = 'low';

let balls = [];
let pegs = [];
let history = [];

const rows = 12;
const radius = 7;

const multipliers = {
  low:[5.6,2.1,1.1,1,.5,.3,.5,1,1.1,2.1,5.6],
  med:[13,3,1.3,.7,.4,.2,.4,.7,1.3,3,13],
  high:[29,4,1.5,.3,.2,.1,.2,.3,1.5,4,29]
};

function build(){

  pegs = [];

  const gapY = H/(rows+3);

  for(let r=0;r<rows;r++){

    const cols = r+3;

    const gapX = W/(cols+1);

    for(let c=0;c<cols;c++){

      pegs.push({
        x:gapX*(c+1),
        y:80+r*gapY
      });

    }

  }

}

build();

function draw(){

  ctx.clearRect(0,0,W,H);

  pegs.forEach(p=>{

    ctx.beginPath();
    ctx.arc(p.x,p.y,5,0,Math.PI*2);

    ctx.fillStyle='#a0c4ff';
    ctx.shadowBlur=15;
    ctx.shadowColor='#00F5FF';

    ctx.fill();

  });

  balls.forEach(ball=>{

    ctx.beginPath();
    ctx.arc(ball.x,ball.y,radius,0,Math.PI*2);

    const g = ctx.createRadialGradient(
      ball.x-2,
      ball.y-2,
      1,
      ball.x,
      ball.y,
      radius
    );

    g.addColorStop(0,'white');
    g.addColorStop(.4,'#FFD700');
    g.addColorStop(1,'#FF8C00');

    ctx.fillStyle=g;

    ctx.shadowBlur=20;
    ctx.shadowColor='#FFD700';

    ctx.fill();

  });

}

function update(){

  balls.forEach(ball=>{

    ball.vy += .35;

    ball.x += ball.vx;
    ball.y += ball.vy;

    pegs.forEach(peg=>{

      const dx = ball.x - peg.x;
      const dy = ball.y - peg.y;

      const dist = Math.sqrt(dx*dx+dy*dy);

      if(dist < 12){

        ball.vx += (Math.random()-.5)*3;
        ball.vy *= -.75;

      }

    });

    if(ball.y > H-80){

      const slots = multipliers[risk];

      const slot = Math.floor((ball.x/W)*slots.length);

      const mult = slots[Math.max(0,Math.min(slots.length-1,slot))];

      const gain = Math.floor(ball.bet*mult);

      balance += gain;

      document.getElementById('balance').textContent = balance;

      document.getElementById('lastWin').textContent =
        (gain-ball.bet);

      addHistory(mult);

      if(mult > bestMultiplier){

        bestMultiplier = mult;

        document.getElementById('bestMulti').textContent =
          mult+'x';

      }

      ball.dead = true;

    }

  });

  balls = balls.filter(b=>!b.dead);

}

function loop(){

  update();
  draw();

  setTimeout(()=>{

    requestAnimationFrame(loop);

  },1000/120);

}

loop();

function dropBall(){

  const bet = parseInt(document.getElementById('betInput').value);

  if(bet > balance || bet <= 0) return;

  balance -= bet;

  document.getElementById('balance').textContent = balance;

  balls.push({

    x:W/2,
    y:30,
    vx:(Math.random()-.5)*2,
    vy:0,
    bet

  });

}

function setRisk(r,btn){

  risk = r;

  document.querySelectorAll('.risk-btn')
  .forEach(b=>b.classList.remove('active'));

  btn.classList.add('active');

}

function quick(v){

  const input = document.getElementById('betInput');

  input.value = Math.floor(input.value*v);

}

function allIn(){

  document.getElementById('betInput').value = balance;

}

function addHistory(mult){

  history.unshift(mult);

  if(history.length > 15) history.pop();

  document.getElementById('history').innerHTML =
  history.map(h=>`
    <div class="hist-item ${h>=1?'win':'loss'}">
      ${h}x
    </div>
  `).join('');

}

let bestMultiplier = 0;

document.addEventListener('keydown',(e)=>{

  if(e.code === 'Space'){

    e.preventDefault();

    dropBall();

  }

  if(e.key === '1'){
    document.querySelector('.low').click();
  }

  if(e.key === '2'){
    document.querySelector('.med').click();
  }

  if(e.key === '3'){
    document.querySelector('.high').click();
  }

});

</script>

</body>
</html>
